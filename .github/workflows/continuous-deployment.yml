name: Continuous Integration and Delivery with Github Actions

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build and Test
      run: mvn clean package

    - name: Docker Compose Build
      run: docker compose build

    - name: Start the API, the database and LocalStack
      run: docker compose up -d

    - name: Wait for the API
      run: |
        for _ in $(seq 1 40); do
          if curl -fsS -o /dev/null http://localhost:8080/swagger-ui/index.html; then exit 0; fi
          sleep 3
        done
        docker compose logs
        exit 1

    - name: Show the logs of the containers
      if: failure()
      run: docker compose logs

    - name: Stop the containers
      if: always()
      run: docker compose down -v

    - name: Push to Docker Hub
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-erudio:latest \
                   ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-erudio:${{ github.run_id }}

        docker push ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-erudio:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-erudio:${{ github.run_id }}
